name: Build Android AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Assets & Capacitor Android
        run: |
          mkdir -p www
          cp index.html www/
          cp "DIGITAL-KHEL.png" www/ || true
          cp "Arrow puzzle logo.png" www/ || true
          npm install -g @capacitor/cli @capacitor/core
          npm install
          npx cap add android || true
          npx cap update android

      - name: Build Signed Release Bundle (AAB)
        run: |
          keytool -genkey -v -keystore release.keystore -alias dkkey -keyalg RSA -keysize 2048 -validity 10000 -storepass digitalkhel123 -keypass digitalkhel123 -dname "CN=Digital Khel, O=Digital Khel, C=IN"
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file=../release.keystore -Pandroid.injected.signing.store.password=digitalkhel123 -Pandroid.injected.signing.key.alias=dkkey -Pandroid.injected.signing.key.password=digitalkhel123

      - name: Upload Artifacts (AAB File)
        uses: actions/upload-artifact@v4
        with:
          name: Arrow-Puzzle-AAB
          path: android/app/build/outputs/bundle/release/*.aab
