name: Final Working Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean Setup Capacitor & Android Platform
        run: |
          # 1. Remove any broken old configs or folders
          rm -rf www android node_modules package.json package-lock.json capacitor.config.json capacitor.config.ts

          # 2. Create www folder and copy HTML + Logos
          mkdir -p www
          HTML_FILE=$(find . -maxdepth 2 -iname "*.html*" | head -n 1)
          cp "$HTML_FILE" www/index.html

          DK_LOGO=$(find . -maxdepth 2 -iname "DIGITAL-KHEL*" | head -n 1)
          if [ -n "$DK_LOGO" ]; then cp "$DK_LOGO" "www/DIGITAL-KHEL.png"; fi

          GAME_LOGO=$(find . -maxdepth 2 -iname "Arrow*logo*" | head -n 1)
          if [ -n "$GAME_LOGO" ]; then cp "$GAME_LOGO" "www/Arrow puzzle logo.png"; fi

          # 3. Create 100% clean package.json
          cat << 'EOF' > package.json
          {
            "name": "arrow-puzzle",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "6.1.2",
              "@capacitor/cli": "6.1.2",
              "@capacitor/android": "6.1.2",
              "@capacitor-community/admob": "6.0.0"
            }
          }
          EOF

          # 4. Create 100% clean capacitor.config.json (No deprecated options!)
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.digitalkhel.arrowpuzzle",
            "appName": "Arrow Puzzle",
            "webDir": "www"
          }
          EOF

          # 5. Install and Add Android Platform
          npm install
          npx cap add android
          npx cap sync android

      - name: Inject AdMob & Meta IDs + App Icon
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          STRINGS="android/app/src/main/res/values/strings.xml"

          if [ -f "$STRINGS" ]; then
            sed -i 's|</resources>|    <string name="facebook_app_id">953250167441885</string>\n    <string name="facebook_client_token">d5435ea514ff2a885c8d48939832af0f</string>\n</resources>|g' "$STRINGS"
          fi

          if [ -f "$MANIFEST" ]; then
            sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9990400518181461~1917528301"/>\n        <meta-data android:name="com.facebook.sdk.ApplicationId" android:value="@string/facebook_app_id"/>\n        <meta-data android:name="com.facebook.sdk.ClientToken" android:value="@string/facebook_client_token"/>\n    </application>|g' "$MANIFEST"
          fi

          if [ -f "www/Arrow puzzle logo.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              cp "www/Arrow puzzle logo.png" "$dir/ic_launcher.png" 2>/dev/null || true
              cp "www/Arrow puzzle logo.png" "$dir/ic_launcher_round.png" 2>/dev/null || true
              cp "www/Arrow puzzle logo.png" "$dir/ic_launcher_foreground.png" 2>/dev/null || true
            done
          fi

      - name: Generate Keystore & Build Signed AAB + APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias dkkey -keyalg RSA -keysize 2048 -validity 10000 -storepass digitalkhel123 -keypass digitalkhel123 -dname "CN=Digital Khel, O=Digital Khel, C=IN"

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
            -Pandroid.injected.signing.store.password=digitalkhel123 \
            -Pandroid.injected.signing.key.alias=dkkey \
            -Pandroid.injected.signing.key.password=digitalkhel123

      - name: Upload Signed AAB & APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital-Khel-Arrow-Puzzle-Release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
            release.keystore
